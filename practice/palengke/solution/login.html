<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Log in to Palengke Online">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; connect-src 'self' http://localhost:4000 http://localhost; img-src 'self' http://localhost:4000 http://localhost data:; style-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Log in · Palengke Online</title>
  <link rel="stylesheet" href="vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="vendor/bootstrap/js/bootstrap.bundle.min.js" defer></script>
  <script src="js/api.js" defer></script>
  <script src="js/login.js" defer></script>
</head>
<body>
  <a class="visually-hidden-focusable" href="#main">Skip to content</a>

  <header class="sticky-top">
    <nav class="navbar navbar-expand-lg navbar-dark bg-palengke" aria-label="Main">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">Palengke Online</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#site-nav"
                aria-controls="site-nav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="site-nav">
          <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Shop</a></li>
          </ul>
          <div id="nav-user" class="d-flex flex-wrap align-items-center gap-2 py-2 py-lg-0"></div>
        </div>
      </div>
    </nav>
  </header>

  <!-- A narrow centred card: 6 of 12 columns from 768px, 4 of 12 from 992px -->
  <main id="main" class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-4">
        <section class="card shadow-sm" aria-labelledby="page-title">
          <div class="card-body p-4">
            <h1 id="page-title" class="h3 mb-3">Log in</h1>
            <div id="login-alert" role="alert" hidden></div>
            <form id="login-form" novalidate>
              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" class="form-control" autocomplete="email" maxlength="100" required aria-describedby="email-error">
                <div id="email-error" class="invalid-feedback">Enter your email address.</div>
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" class="form-control" autocomplete="current-password" maxlength="100" required aria-describedby="password-error">
                <div id="password-error" class="invalid-feedback">Enter your password.</div>
              </div>
              <button type="submit" class="btn btn-palengke w-100" id="login-btn">Log in</button>
            </form>
            <p class="mt-3 mb-0 text-center">No account yet? <a href="register.html">Register</a></p>
          </div>
        </section>
      </div>
    </div>
  </main>

  <footer class="bg-palengke-dark text-white py-4 mt-5">
    <div class="container d-flex flex-column flex-md-row justify-content-between gap-2">
      <p class="mb-0">&copy; 2026 Palengke Online</p>
      <p class="mb-0">We use your details only for your orders (RA 10173).</p>
    </div>
  </footer>
</body>
</html>
